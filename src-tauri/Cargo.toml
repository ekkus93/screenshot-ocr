[package]
name = "screenshot-ocr"
version = "0.1.0"
description = "Privacy-first local screen-region OCR for Linux"
authors = ["Phillip Chin"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ekkus93/screenshot-ocr"

[lib]
name = "screenshot_ocr_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "screenshot-ocr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["screenshot", "tokio"] }
async-trait = "0.1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
