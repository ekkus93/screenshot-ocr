name: Format action router bootstrap

on:
  push:
    branches: [master]
    paths:
      - .github/format-action-router-trigger.txt

permissions:
  contents: write

concurrency:
  group: format-action-router-bootstrap
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Format only the implementation bootstrap
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write .github/workflows/implement-action-router.yml
          test "$(git diff --name-only)" = ".github/workflows/implement-action-router.yml"
          git diff --check

      - name: Commit formatted bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/implement-action-router.yml
          git commit -m "ci: format action router bootstrap"
          git push origin HEAD:master
