name: Implement cross-platform action router

on:
  push:
    branches: [master]
    paths:
      - .github/action-router-trigger.txt

permissions:
  contents: write

concurrency:
  group: implement-action-router
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Install Tauri Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Write reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(r'''
          {
            "docs/adr/0002-cross-platform-activation-and-cancellation.md": "",
            "src-tauri/Cargo.toml": "",
            "src-tauri/src/actions.rs": "...]"} ... truncated for display