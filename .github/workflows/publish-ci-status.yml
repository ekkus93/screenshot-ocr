name: Publish CI Status

on:
  workflow_run:
    workflows:
      - CI
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-ci-status-ci-master
  cancel-in-progress: true

jobs:
  publish:
    name: Publish latest CI status
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: "1"
      MONITORED_BRANCH: master
      WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_STATUS: ${{ github.event.workflow_run.status }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CREATED_AT: ${{ github.event.workflow_run.created_at }}
      UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Update authoritative CI issue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import copy
          import datetime as dt
          import html
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          API_ROOT = "https://api.github.com"
          API_VERSION = "2022-11-28"
          MARKER = "<!-- maintained by .github/workflows/publish-ci-status.yml -->"
          ABNORMAL = {
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "startup_failure",
              "stale",
          }
          SOFT_BODY_LIMIT_BYTES = 60_000
          HARD_BODY_LIMIT_BYTES = 65_000

          def require_env(name: str) -> str:
              value = os.environ.get(name, "")
              if not value:
                  raise RuntimeError(f"required environment value is empty: {name}")
              return value

          repository = require_env("REPOSITORY")
          issue_number = int(require_env("ISSUE_NUMBER"))
          monitored_branch = require_env("MONITORED_BRANCH")
          workflow_id = int(require_env("WORKFLOW_ID"))
          workflow_name = require_env("WORKFLOW_NAME")
          run_id = int(require_env("RUN_ID"))
          run_attempt = int(require_env("RUN_ATTEMPT"))
          run_url = require_env("RUN_URL")
          run_status = require_env("RUN_STATUS")
          run_conclusion = os.environ.get("RUN_CONCLUSION", "") or None
          run_event = require_env("RUN_EVENT")
          head_branch = require_env("HEAD_BRANCH")
          head_sha = require_env("HEAD_SHA")
          created_at = require_env("CREATED_AT")
          updated_at = require_env("UPDATED_AT")
          token = require_env("GH_TOKEN")

          if head_branch != monitored_branch:
              print(
                  f"Ignoring workflow run for unrelated branch {head_branch!r}; "
                  f"publisher monitors {monitored_branch!r}."
              )
              raise SystemExit(0)

          def api_json(
              method: str,
              path: str,
              payload: dict[str, Any] | None = None,
              attempts: int = 3,
          ) -> Any:
              url = path if path.startswith("https://") else f"{API_ROOT}{path}"
              data = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": API_VERSION,
                  "User-Agent": "screenshot-ocr-ci-status-publisher",
              }
              if payload is not None:
                  data = json.dumps(payload, separators=(",", ":")).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      url,
                      data=data,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          raw = response.read()
                          if not raw:
                              return None
                          return json.loads(raw.decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      retryable = exc.code == 429 or 500 <= exc.code <= 599
                      detail = exc.read(1024).decode("utf-8", errors="replace")
                      if retryable and attempt < attempts:
                          time.sleep(attempt * 2)
                          continue
                      raise RuntimeError(
                          f"GitHub API {method} {path} failed with HTTP {exc.code}: {detail}"
                      ) from exc
                  except urllib.error.URLError as exc:
                      if attempt < attempts:
                          time.sleep(attempt * 2)
                          continue
                      raise RuntimeError(
                          f"GitHub API {method} {path} failed: {exc.reason}"
                      ) from exc
              raise AssertionError("unreachable retry loop")

          def require_dict(value: Any, context: str) -> dict[str, Any]:
              if not isinstance(value, dict):
                  raise RuntimeError(f"malformed GitHub API response for {context}: expected object")
              return value

          def require_list(value: Any, context: str) -> list[Any]:
              if not isinstance(value, list):
                  raise RuntimeError(f"malformed GitHub API response for {context}: expected array")
              return value

          def fetch_paginated(path: str, list_key: str) -> list[dict[str, Any]]:
              items: list[dict[str, Any]] = []
              separator = "&" if "?" in path else "?"
              page = 1
              while True:
                  response = require_dict(
                      api_json("GET", f"{path}{separator}per_page=100&page={page}"),
                      f"{list_key} page {page}",
                  )
                  page_items = require_list(response.get(list_key), f"{list_key} page {page}")
                  for index, item in enumerate(page_items):
                      items.append(require_dict(item, f"{list_key} page {page} item {index}"))
                  if len(page_items) < 100:
                      return items
                  page += 1
                  if page > 1_000:
                      raise RuntimeError(f"pagination limit exceeded while reading {list_key}")

          def latest_applicable_run_id() -> int:
              query = urllib.parse.urlencode({"branch": monitored_branch, "per_page": 1})
              response = require_dict(
                  api_json(
                      "GET",
                      f"/repos/{repository}/actions/workflows/{workflow_id}/runs?{query}",
                  ),
                  "latest workflow run",
              )
              runs = require_list(response.get("workflow_runs"), "latest workflow run list")
              if not runs:
                  raise RuntimeError("latest workflow run query returned no runs")
              latest = require_dict(runs[0], "latest workflow run item")
              latest_id = latest.get("id")
              if not isinstance(latest_id, int):
                  raise RuntimeError("latest workflow run has no numeric id")
              return latest_id

          latest_id = latest_applicable_run_id()
          if latest_id != run_id:
              print(f"Skipping stale run {run_id}; latest applicable run is {latest_id}.")
              raise SystemExit(0)

          issue = require_dict(
              api_json("GET", f"/repos/{repository}/issues/{issue_number}"),
              "status issue",
          )
          current_body = issue.get("body")
          if not isinstance(current_body, str) or MARKER not in current_body:
              raise RuntimeError(
                  f"refusing to overwrite issue #{issue_number}: ownership marker is missing"
              )
          if issue.get("state") != "open":
              raise RuntimeError(f"refusing to update closed status issue #{issue_number}")

          existing_run_ids = [int(value) for value in re.findall(r'"run_id"\s*:\s*(\d+)', current_body)]
          if existing_run_ids and max(existing_run_ids) > run_id:
              print(
                  f"Skipping stale run {run_id}; status issue already contains newer run "
                  f"{max(existing_run_ids)}."
              )
              raise SystemExit(0)

          raw_jobs = fetch_paginated(
              f"/repos/{repository}/actions/runs/{run_id}/jobs?filter=latest",
              "jobs",
          )

          raw_artifacts: list[dict[str, Any]] = []
          artifacts_availability = "pending"
          if run_status == "completed":
              artifacts_availability = "available"
              for attempt in range(1, 4):
                  raw_artifacts = fetch_paginated(
                      f"/repos/{repository}/actions/runs/{run_id}/artifacts",
                      "artifacts",
                  )
                  if raw_artifacts or attempt == 3:
                      break
                  time.sleep(attempt * 2)

          def optional_string(value: Any) -> str | None:
              return value if isinstance(value, str) and value else None

          jobs: list[dict[str, Any]] = []
          problem_steps: list[dict[str, Any]] = []
          problem_jobs: list[dict[str, Any]] = []

          for raw_job in raw_jobs:
              job_id = raw_job.get("id")
              job_name = raw_job.get("name")
              if not isinstance(job_id, int) or not isinstance(job_name, str):
                  raise RuntimeError("job response is missing numeric id or string name")

              steps: list[dict[str, Any]] = []
              raw_steps = require_list(raw_job.get("steps", []), f"steps for job {job_id}")
              for raw_step_value in raw_steps:
                  raw_step = require_dict(raw_step_value, f"step for job {job_id}")
                  number = raw_step.get("number")
                  name = raw_step.get("name")
                  if not isinstance(number, int) or not isinstance(name, str):
                      raise RuntimeError(f"job {job_id} contains malformed step metadata")
                  conclusion = optional_string(raw_step.get("conclusion"))
                  step = {
                      "number": number,
                      "name": name,
                      "status": optional_string(raw_step.get("status")),
                      "conclusion": conclusion,
                      "started_at": optional_string(raw_step.get("started_at")),
                      "completed_at": optional_string(raw_step.get("completed_at")),
                  }
                  steps.append(step)
                  if conclusion in ABNORMAL:
                      problem_steps.append(
                          {
                              "job_id": job_id,
                              "job": job_name,
                              "step_number": number,
                              "step": name,
                              "conclusion": conclusion,
                          }
                      )

              job_conclusion = optional_string(raw_job.get("conclusion"))
              if job_conclusion in ABNORMAL:
                  problem_jobs.append(
                      {
                          "job_id": job_id,
                          "job": job_name,
                          "conclusion": job_conclusion,
                      }
                  )

              jobs.append(
                  {
                      "id": job_id,
                      "name": job_name,
                      "status": optional_string(raw_job.get("status")),
                      "conclusion": job_conclusion,
                      "started_at": optional_string(raw_job.get("started_at")),
                      "completed_at": optional_string(raw_job.get("completed_at")),
                      "runner_name": optional_string(raw_job.get("runner_name")),
                      "runner_group_name": optional_string(raw_job.get("runner_group_name")),
                      "steps": steps,
                  }
              )

          artifacts: list[dict[str, Any]] = []
          for raw_artifact in raw_artifacts:
              artifact_id = raw_artifact.get("id")
              artifact_name = raw_artifact.get("name")
              if not isinstance(artifact_id, int) or not isinstance(artifact_name, str):
                  raise RuntimeError("artifact response is missing numeric id or string name")
              artifacts.append(
                  {
                      "id": artifact_id,
                      "name": artifact_name,
                      "size_in_bytes": raw_artifact.get("size_in_bytes"),
                      "expired": raw_artifact.get("expired"),
                      "created_at": optional_string(raw_artifact.get("created_at")),
                      "expires_at": optional_string(raw_artifact.get("expires_at")),
                  }
              )

          observed_at = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          jobs_availability = "available" if jobs else (
              "pending" if run_status != "completed" else "available_empty"
          )

          payload: dict[str, Any] = {
              "schema_version": 1,
              "publisher": {
                  "workflow_file": ".github/workflows/publish-ci-status.yml",
                  "issue_number": issue_number,
                  "monitored_branch": monitored_branch,
              },
              "workflow": {
                  "name": workflow_name,
                  "workflow_id": workflow_id,
                  "run_id": run_id,
                  "run_attempt": run_attempt,
                  "run_url": run_url,
                  "event": run_event,
                  "status": run_status,
                  "conclusion": run_conclusion,
                  "head_branch": head_branch,
                  "head_sha": head_sha,
                  "created_at": created_at,
                  "updated_at": updated_at,
                  "observed_at": observed_at,
              },
              "jobs_availability": jobs_availability,
              "artifacts_availability": artifacts_availability,
              "problem_jobs": problem_jobs,
              "problem_steps": problem_steps,
              "jobs": jobs,
              "artifacts": artifacts,
              "details_compacted": False,
          }

          def code(value: Any) -> str:
              rendered = "none" if value is None or value == "" else str(value)
              return f"<code>{html.escape(rendered, quote=True)}</code>"

          completed_jobs = sum(1 for job in jobs if job["status"] == "completed")
          abnormal_jobs = sum(1 for job in jobs if job["conclusion"] in ABNORMAL)
          running_jobs = sum(
              1 for job in jobs if job["status"] in {"queued", "in_progress", "waiting"}
          )

          if problem_steps:
              problem_summary = "\n".join(
                  f"  - {code(step['job'])} / {code(step['step'])} — {code(step['conclusion'])}"
                  for step in problem_steps
              )
          elif problem_jobs:
              problem_summary = "\n".join(
                  f"  - {code(job['job'])} — {code(job['conclusion'])}"
                  for job in problem_jobs
              )
          else:
              problem_summary = "  - None"

          jobs_summary = (
              f"{completed_jobs} completed, {abnormal_jobs} abnormal, "
              f"{running_jobs} running, {len(jobs)} visible"
          )
          human_summary = "\n".join(
              [
                  MARKER,
                  "# Latest Hosted Quality Gates",
                  "",
                  f"- **Status:** {code(run_status)}",
                  f"- **Conclusion:** {code(run_conclusion)}",
                  f"- **Run:** [{run_id}]({run_url})",
                  f"- **Attempt:** {code(run_attempt)}",
                  f"- **Commit:** {code(head_sha)}",
                  f"- **Branch/event:** {code(head_branch)} / {code(run_event)}",
                  f"- **Jobs:** {code(jobs_summary)}",
                  "- **Problem steps:**",
                  problem_summary,
                  f"- **Artifacts:** {code(f'{len(artifacts)} ({artifacts_availability})')}",
                  f"- **Observed:** {code(observed_at)}",
                  "",
              ]
          )

          def render_body(status_payload: dict[str, Any]) -> str:
              machine_json = json.dumps(
                  status_payload,
                  indent=2,
                  ensure_ascii=False,
                  sort_keys=True,
              )
              json.loads(machine_json)
              return (
                  f"{human_summary}\n"
                  "## Machine-readable status\n\n"
                  f"```json\n{machine_json}\n```\n\n"
                  "This issue is overwritten whenever the latest applicable run changes state. "
                  "It is not a historical log.\n"
              )

          body = render_body(payload)
          if len(body.encode("utf-8")) > SOFT_BODY_LIMIT_BYTES:
              compacted = copy.deepcopy(payload)
              compacted["details_compacted"] = True
              compacted["compaction_reason"] = "issue_body_size_limit"
              for job in compacted["jobs"]:
                  if job.get("conclusion") not in ABNORMAL:
                      step_count = len(job.get("steps", []))
                      job["steps"] = []
                      job["steps_compacted"] = True
                      job["step_count"] = step_count
              body = render_body(compacted)

          body_size = len(body.encode("utf-8"))
          if body_size > HARD_BODY_LIMIT_BYTES:
              raise RuntimeError(
                  f"generated issue body is {body_size} bytes after compaction; refusing invalid truncation"
              )

          final_latest_id = latest_applicable_run_id()
          if final_latest_id != run_id:
              print(
                  f"Skipping stale run {run_id} before publish; latest applicable run is "
                  f"{final_latest_id}."
              )
              raise SystemExit(0)

          api_json(
              "PATCH",
              f"/repos/{repository}/issues/{issue_number}",
              {"body": body},
          )
          print(
              f"Published workflow {workflow_name!r} run {run_id} attempt {run_attempt} "
              f"for {head_sha} to issue #{issue_number}."
          )
          PY
