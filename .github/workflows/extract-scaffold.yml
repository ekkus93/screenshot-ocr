# Retriggered after this workflow existed on the default branch.
name: Extract reviewed project scaffold

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/extract-scaffold.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-reviewed-scaffold-master
  cancel-in-progress: false

jobs:
  extract:
    name: Verify and extract scaffold
    if: github.repository == 'ekkus93/screenshot-ocr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify archive and extract reviewed files
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .bootstrap/scaffold.part.00 \
            .bootstrap/scaffold.part.01 \
            .bootstrap/scaffold.part.02 \
            .bootstrap/scaffold.part.03a \
            .bootstrap/scaffold.part.03b \
            .bootstrap/scaffold.part.03c \
            .bootstrap/scaffold.part.03d \
            .bootstrap/scaffold.part.04a \
            .bootstrap/scaffold.part.04b \
            .bootstrap/scaffold.part.04c \
            .bootstrap/scaffold.part.04d \
            .bootstrap/scaffold.part.05a \
            .bootstrap/scaffold.part.05b \
            .bootstrap/scaffold.part.05c \
            > "${RUNNER_TEMP}/scaffold.tar.gz.b64"

          printf '%s  %s\n' \
            '89dd010e145978491fc200bf9b095fe616bb9781fcb5a6ba4816be6ea253e0f9' \
            "${RUNNER_TEMP}/scaffold.tar.gz.b64" \
            | sha256sum --check --strict

          base64 --decode \
            "${RUNNER_TEMP}/scaffold.tar.gz.b64" \
            > "${RUNNER_TEMP}/scaffold.tar.gz"

          printf '%s  %s\n' \
            'dad9e7b02b53aa15384c5e794563f29f67445f7eb5061a9ef3a3544e5d6586b3' \
            "${RUNNER_TEMP}/scaffold.tar.gz" \
            | sha256sum --check --strict

          python3 - "${RUNNER_TEMP}/scaffold.tar.gz" <<'PY'
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          with tarfile.open(archive, mode="r:gz") as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit("reviewed scaffold archive is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name!r}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive links are forbidden: {member.name!r}")
          print(f"Validated {len(members)} reviewed archive entries.")
          PY

          tar \
            --extract \
            --gzip \
            --file "${RUNNER_TEMP}/scaffold.tar.gz" \
            --directory . \
            --no-same-owner \
            --no-same-permissions

          rm -rf .bootstrap
          rm -f .github/workflows/extract-scaffold.yml

      - name: Commit scaffold to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'build: scaffold Screenshot OCR application'
          git push origin HEAD:master
