# Authoritative hosted quality and packaging gates for master.
name: CI

on:
  push:
    branches: [master, ralph/windows-support]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate baseline and source-file limits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("LICENSE"),
              Path("package.json"),
              Path("package-lock.json"),
              Path("src-tauri/Cargo.toml"),
              Path("src-tauri/Cargo.lock"),
              Path("docs/SCREENSHOT_OCR_V0_1_SPEC.md"),
              Path("docs/SCREENSHOT_OCR_V0_1_TODO.md"),
          ]
          problems = [
              f"missing or empty: {path}"
              for path in required
              if not path.is_file() or path.stat().st_size == 0
          ]
          source_suffixes = {".rs", ".ts", ".tsx", ".js", ".jsx"}
          ignored_parts = {"node_modules", "target", "dist"}
          for path in Path(".").rglob("*"):
              if (
                  path.is_file()
                  and path.suffix in source_suffixes
                  and not any(part in ignored_parts for part in path.parts)
              ):
                  lines = len(path.read_text(encoding="utf-8").splitlines())
                  if lines > 800:
                      problems.append(
                          f"first-party source exceeds 800 lines ({lines}): {path}"
                      )
          if problems:
              raise SystemExit("\n".join(problems))
          print("Repository baseline and source-file limits are valid.")
          PY

      - name: Check content-leakage source guard
        run: python3 scripts/check-content-leakage.py

      - name: Check portable-core platform boundary
        run: python3 scripts/check-platform-boundaries.py

      - name: Ensure no broad Tauri capability wildcard
        shell: bash
        run: |
          set -euo pipefail
          if grep -R '"permissions".*\*' src-tauri/capabilities; then
            echo "Wildcard Tauri capability is forbidden." >&2
            exit 1
          fi

  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run format:check; then
            npx prettier --write .
            git diff -- .
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build

  layout-regression:
    name: Frontend layout regression (Playwright)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run no-scroll layout regression tests
        run: npm run test:layout

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  rust-quality:
    name: Rust quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tauri Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-features --locked

      - name: Build Rust workspace
        run: cargo build --manifest-path src-tauri/Cargo.toml --workspace --all-features --locked

  windows-quality:
    name: Windows quality gates
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate Windows icon resources
        run: npm run tauri -- icon src-tauri/icons/128x128.png

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Windows Clippy with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Run Windows Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked

      - name: Build Windows Rust workspace
        run: cargo build --manifest-path src-tauri/Cargo.toml --workspace --locked

      - name: Link Windows Tauri application
        run: npm run tauri -- build --no-bundle

  windows-packaging-smoke:
    name: Windows NSIS packaging smoke (not published)
    needs: [windows-quality]
    if: github.ref == 'refs/heads/ralph/windows-support'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Stage checksum-verified OCR runtime without executing setup
        shell: pwsh
        run: ./scripts/audit-windows-ocr-runtime.ps1 -StageRuntime

      - name: Build Windows NSIS smoke installer
        run: npm run tauri -- build --bundles nsis

      - name: Verify NSIS payload and generate local checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) { throw "7-Zip unavailable." }
          $extracted = Join-Path $env:RUNNER_TEMP "screenshot-ocr-nsis-smoke"
          New-Item -ItemType Directory -Force -Path $extracted | Out-Null
          & $sevenZip x "-o$extracted" -y $installers[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "NSIS payload extraction failed." }
          $runtime = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter "tesseract.exe")
          $english = @(Get-ChildItem -LiteralPath $extracted -Recurse -File -Filter "eng.traineddata")
          if ($runtime.Count -ne 1 -or $english.Count -ne 1) {
            throw "NSIS payload missing bundled Tesseract or English data."
          }
          $manifest = Get-Content -LiteralPath "windows-ocr-runtime-audit.json" -Raw | ConvertFrom-Json
          foreach ($item in @(
            @{ file = $runtime[0]; name = "tesseract.exe" },
            @{ file = $english[0]; name = "tessdata/eng.traineddata" }
          )) {
            $expected = @($manifest.files | Where-Object { $_.name -eq $item.name })
            if ($expected.Count -ne 1) { throw "Missing expected runtime manifest entry." }
            $actual = (Get-FileHash -LiteralPath $item.file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected[0].sha256) { throw "NSIS bundled runtime digest mismatch." }
          }
          $checksum = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "NSIS smoke payload verified; SHA-256: $checksum"
          Write-Output "Not publishing: dependency-license and physical desktop acceptance pending."

  packaging:
    name: Debian package smoke
    needs: [frontend-quality, layout-regression, rust-quality]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/ralph/windows-support'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify committed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          test -s src-tauri/Cargo.lock

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build Debian package
        run: npm run tauri -- build --bundles deb

      - name: Inspect Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --info "${package}"
          sha256sum "${package}" | tee package.sha256

      - name: Upload reviewed package artifact
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-ocr-deb-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            package.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            package.sha256
          generate_release_notes: true
