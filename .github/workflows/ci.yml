name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-bootstrap-master
  cancel-in-progress: false

jobs:
  commit-verified-lockfiles:
    name: Commit verified lockfiles
    if: github.repository == 'ekkus93/screenshot-ocr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Generate and verify lockfiles
        shell: bash
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          test ! -e src-tauri/Cargo.lock
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          printf '%s  %s\n' \
            '311ce6b191cd906d6c5ea4778f23ab88627d1ff542229e3a687c08176dd21f0a' \
            package-lock.json \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            '6558cf0cc2cb0693e662e4e83ef17c8de5de7217eaa9a506647677099add6915' \
            src-tauri/Cargo.lock \
            | sha256sum --check --strict

      - name: Commit lockfiles to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --check
          git commit -m 'build: commit verified dependency lockfiles'
          git push origin HEAD:master
