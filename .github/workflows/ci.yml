name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formatter-master
  cancel-in-progress: false

jobs:
  apply-formatters:
    name: Apply pinned formatters
    if: github.repository == 'ekkus93/screenshot-ocr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Apply exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes were required."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style: apply pinned formatter output'
          git push origin HEAD:master
