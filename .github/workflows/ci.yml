name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formatting-bootstrap-master
  cancel-in-progress: false

jobs:
  apply-required-formatting:
    name: Apply required formatting
    if: github.repository == 'ekkus93/screenshot-ocr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Format exact reported frontend and documentation files
        shell: bash
        run: |
          set -euo pipefail
          npm exec prettier -- --write \
            docs/CI_STATUS_BRIDGE.md \
            docs/SCREENSHOT_OCR_V0_1_SPEC.md \
            docs/THREAT_MODEL.md \
            src/app/App.tsx \
            src/app/useAppController.ts \
            src/features/capture/CapturePanel.tsx \
            src/features/diagnostics/DiagnosticsPanel.tsx \
            src/features/settings/SettingsPanel.tsx \
            src/styles/index.css \
            tsconfig.json

      - name: Format first-party Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate formatting scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          allowed_exact = {
              "docs/CI_STATUS_BRIDGE.md",
              "docs/SCREENSHOT_OCR_V0_1_SPEC.md",
              "docs/THREAT_MODEL.md",
              "src/app/App.tsx",
              "src/app/useAppController.ts",
              "src/features/capture/CapturePanel.tsx",
              "src/features/diagnostics/DiagnosticsPanel.tsx",
              "src/features/settings/SettingsPanel.tsx",
              "src/styles/index.css",
              "tsconfig.json",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          unexpected = sorted(
              path
              for path in changed
              if path not in allowed_exact and Path(path).suffix != ".rs"
          )
          if unexpected:
              raise SystemExit(
                  "unexpected formatting changes:\n" + "\n".join(unexpected)
              )
          if not changed:
              raise SystemExit("formatting job produced no changes")
          print("Formatting scope is valid:")
          print("\n".join(sorted(changed)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style: apply required source formatting'
          git push origin HEAD:master
