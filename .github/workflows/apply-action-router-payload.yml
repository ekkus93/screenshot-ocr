name: Apply action router payload

on:
  push:
    branches: [master]
    paths:
      - .github/apply-action-router-trigger.txt

permissions:
  contents: write

concurrency:
  group: apply-action-router-payload
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Install Tauri Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Apply, validate, and publish reviewed payload
        shell: bash
        run: |
          set -uo pipefail
          report="docs/ACTION_ROUTER_VALIDATION_RESULT.md"
          log="${RUNNER_TEMP}/action-router-validation.log"
          rm -f "${report}"

          validate() {
            set -euo pipefail
            python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          workflow = Path(".github/workflows/implement-action-router.yml").read_text(encoding="utf-8")
          marker = "payload = json.loads(r'''"
          if workflow.count(marker) != 1:
              raise SystemExit("reviewed payload marker is missing or ambiguous")
          encoded = workflow.split(marker, 1)[1].split("''')", 1)[0]
          payload = json.loads(encoded)
          expected = {
              "docs/adr/0002-cross-platform-activation-and-cancellation.md",
              "src-tauri/Cargo.toml",
              "src-tauri/src/actions.rs",
              "src-tauri/src/app.rs",
              "src-tauri/src/commands.rs",
              "src-tauri/src/desktop.rs",
              "src-tauri/src/diagnostics.rs",
              "src-tauri/src/lib.rs",
              "src-tauri/src/models.rs",
              "src-tauri/src/state.rs",
              "src/app/App.test.tsx",
              "src/app/useAppController.ts",
              "src/lib/tauri.ts",
              "src/lib/types.ts",
          }
          if set(payload) != expected:
              raise SystemExit("reviewed payload path set changed")
          for relative, value in payload.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(value, validate=True))
          PY

            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            npm ci
            npx prettier --write \
              docs/adr/0002-cross-platform-activation-and-cancellation.md \
              src/app/App.test.tsx \
              src/app/useAppController.ts \
              src/lib/tauri.ts \
              src/lib/types.ts
            cargo fmt --manifest-path src-tauri/Cargo.toml --all

            python3 - <<'PY'
          from pathlib import Path

          suffixes = {".rs", ".ts", ".tsx", ".js", ".jsx"}
          ignored = {"node_modules", "target", "dist"}
          oversized = []
          for path in Path(".").rglob("*"):
              if path.is_file() and path.suffix in suffixes and not any(part in ignored for part in path.parts):
                  lines = len(path.read_text(encoding="utf-8").splitlines())
                  if lines > 800:
                      oversized.append(f"{path}: {lines} lines")
          if oversized:
              raise SystemExit("first-party source exceeds 800 lines:\n" + "\n".join(oversized))
          PY

            npm run format:check
            npm run lint
            npm run typecheck
            npm run test
            npm run build
            cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
            cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
            cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-features --locked
            cargo build --manifest-path src-tauri/Cargo.toml --workspace --all-features --locked

            python3 - <<'PY'
          import subprocess

          expected = {
              "docs/adr/0002-cross-platform-activation-and-cancellation.md",
              "src-tauri/Cargo.lock",
              "src-tauri/Cargo.toml",
              "src-tauri/src/actions.rs",
              "src-tauri/src/app.rs",
              "src-tauri/src/commands.rs",
              "src-tauri/src/desktop.rs",
              "src-tauri/src/diagnostics.rs",
              "src-tauri/src/lib.rs",
              "src-tauri/src/models.rs",
              "src-tauri/src/state.rs",
              "src/app/App.test.tsx",
              "src/app/useAppController.ts",
              "src/lib/tauri.ts",
              "src/lib/types.ts",
          }
          changed = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f"unexpected changed paths: {sorted(paths ^ expected)}")
          PY
          }

          set +e
          validate >"${log}" 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${status}" -ne 0 ]; then
            {
              echo "# Action Router Validation Result"
              echo
              echo "**Status:** Failed before source publication"
              echo
              echo '```text'
              tail -n 180 "${log}" | sed "s#${GITHUB_WORKSPACE}#<workspace>#g"
              echo '```'
            } >"${report}"
            git add "${report}"
            git commit -m "docs: record action router validation failure"
            git push origin HEAD:master
            exit "${status}"
          fi

          cat "${log}"
          git add \
            docs/adr/0002-cross-platform-activation-and-cancellation.md \
            src-tauri/Cargo.lock \
            src-tauri/Cargo.toml \
            src-tauri/src/actions.rs \
            src-tauri/src/app.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/desktop.rs \
            src-tauri/src/diagnostics.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/models.rs \
            src-tauri/src/state.rs \
            src/app/App.test.tsx \
            src/app/useAppController.ts \
            src/lib/tauri.ts \
            src/lib/types.ts
          git diff --cached --check
          git commit -m "feat: add cross-platform action routing"
          git push origin HEAD:master
