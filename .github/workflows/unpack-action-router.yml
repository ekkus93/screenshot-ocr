name: Unpack action router source

on:
  push:
    branches: [master]
    paths:
      - .github/unpack-action-router-trigger.txt

permissions:
  contents: write

concurrency:
  group: unpack-action-router-source
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Unpack and publish reviewed source or exact failure report
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/unpack-action-router.log"
          report="docs/ACTION_ROUTER_UNPACK_RESULT.md"

          apply_source() {
            set -euo pipefail
            python3 .github/unpack_action_router.py
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            npm ci
            npx prettier --write \
              docs/adr/0002-cross-platform-activation-and-cancellation.md \
              src/app/App.test.tsx \
              src/app/useAppController.ts \
              src/lib/tauri.ts \
              src/lib/types.ts
            cargo fmt --manifest-path src-tauri/Cargo.toml --all

            python3 - <<'PY'
          import subprocess

          expected = {
              "docs/adr/0002-cross-platform-activation-and-cancellation.md",
              "src-tauri/Cargo.lock",
              "src-tauri/Cargo.toml",
              "src-tauri/src/actions.rs",
              "src-tauri/src/app.rs",
              "src-tauri/src/commands.rs",
              "src-tauri/src/desktop.rs",
              "src-tauri/src/diagnostics.rs",
              "src-tauri/src/lib.rs",
              "src-tauri/src/models.rs",
              "src-tauri/src/state.rs",
              "src/app/App.test.tsx",
              "src/app/useAppController.ts",
              "src/lib/tauri.ts",
              "src/lib/types.ts",
          }
          changed = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          paths = {line[3:] for line in changed}
          if paths != expected:
              raise SystemExit(f"unexpected changed paths: {sorted(paths ^ expected)}")
          PY

            git diff --check
          }

          set +e
          apply_source >"${log}" 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${status}" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "# Action Router Unpack Result"
              echo
              echo "**Status:** Failed before application source publication"
              echo
              echo '```text'
              tail -n 160 "${log}" | sed "s#${GITHUB_WORKSPACE}#<workspace>#g"
              echo '```'
            } >"${report}"
            git add "${report}"
            git commit -m "docs: record action router unpack failure"
            git push origin HEAD:master
            exit "${status}"
          fi

          cat "${log}"
          git add \
            docs/adr/0002-cross-platform-activation-and-cancellation.md \
            src-tauri/Cargo.lock \
            src-tauri/Cargo.toml \
            src-tauri/src/actions.rs \
            src-tauri/src/app.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/desktop.rs \
            src-tauri/src/diagnostics.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/models.rs \
            src-tauri/src/state.rs \
            src/app/App.test.tsx \
            src/app/useAppController.ts \
            src/lib/tauri.ts \
            src/lib/types.ts
          git diff --cached --check
          git commit -m "feat: add cross-platform action routing"
          git push origin HEAD:master
