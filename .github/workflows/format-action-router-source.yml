name: Format action router source

on:
  push:
    branches: [master]
    paths:
      - .github/format-action-router-source-trigger.txt

permissions:
  contents: write

concurrency:
  group: format-action-router-source
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Format only action router files
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write \
            docs/ACTION_ROUTER_STATUS_2026-08-01.md \
            docs/adr/0002-cross-platform-activation-and-cancellation.md \
            src/app/App.test.tsx \
            src/app/useAppController.ts \
            src/lib/tauri.ts \
            src/lib/types.ts
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

          python3 - <<'PY'
          import subprocess

          allowed = {
              "docs/ACTION_ROUTER_STATUS_2026-08-01.md",
              "docs/adr/0002-cross-platform-activation-and-cancellation.md",
              "src-tauri/src/actions.rs",
              "src-tauri/src/app.rs",
              "src-tauri/src/commands.rs",
              "src-tauri/src/desktop.rs",
              "src-tauri/src/diagnostics.rs",
              "src-tauri/src/lib.rs",
              "src-tauri/src/models.rs",
              "src-tauri/src/state.rs",
              "src/app/App.test.tsx",
              "src/app/useAppController.ts",
              "src/lib/tauri.ts",
              "src/lib/types.ts",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"formatter changed unexpected paths: {sorted(unexpected)}")
          PY
          git diff --check

      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ACTION_ROUTER_STATUS_2026-08-01.md \
            docs/adr/0002-cross-platform-activation-and-cancellation.md \
            src-tauri/src/actions.rs \
            src-tauri/src/app.rs \
            src-tauri/src/commands.rs \
            src-tauri/src/desktop.rs \
            src-tauri/src/diagnostics.rs \
            src-tauri/src/lib.rs \
            src-tauri/src/models.rs \
            src-tauri/src/state.rs \
            src/app/App.test.tsx \
            src/app/useAppController.ts \
            src/lib/tauri.ts \
            src/lib/types.ts
          git commit -m "style: format cross-platform action routing"
          git push origin HEAD:master
